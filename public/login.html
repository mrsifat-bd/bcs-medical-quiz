<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Member log in — MediVerse BCS Question Bank</title><link rel="icon" href="/favicon.png"/><script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script><link rel="stylesheet" href="/styles.css"/></head>
<body>
<header class="top">
  <div class="logo"><img class="logo-img" src="/logo.png" alt="MediVerse" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'"/><b class="logo-fallback" style="display:none">MediVerse</b><span class="logo-sub"><small>BCS Question Bank</small></span></div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="themeToggle" aria-label="Toggle night mode" title="Night mode">🌙</button>
  <a class="btn ghost sm" href="/">← Back</a>
</header>
<script>(function(){var b=document.getElementById('themeToggle');if(!b)return;function u(){b.textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙';}u();b.addEventListener('click',function(){document.documentElement.classList.toggle('dark');try{localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');}catch(e){}u();});})();</script>
<div class="authcard">
  <h2>Member log in</h2>
  <p style="color:var(--muted);font-size:14px;margin-top:0">Full access is for registered &amp; paid members. Your username works on <b>one device only</b>.</p>
  <div id="msg"></div>
  <div class="field"><label>Username</label><input id="u" autocomplete="username"/></div>
  <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"/></div>
  <button class="btn block" id="go">Log in</button>
  <p style="text-align:center;margin-top:16px;font-size:14px">Don't have access yet? <a href="/">Practice free &amp; get full access →</a></p>
</div>
<script src="/common.js"></script>
<script>
document.getElementById("go").addEventListener("click",login);
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
async function login(){
  const msg=document.getElementById("msg");msg.innerHTML="";
  try{const u=await api("/api/login",{method:"POST",body:JSON.stringify({username:document.getElementById("u").value.trim(),password:document.getElementById("p").value,device_id:deviceId()})});
    location.href=u.role==="admin"?"/admin":"/";
  }catch(e){msg.innerHTML=`<div class="msg err">${esc(e.message)}</div>`;}
}
</script></body></html>
